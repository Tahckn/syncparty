name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The installers themselves are still unsigned (no Authenticode/Apple
      # Developer ID certificate) — SmartScreen and Gatekeeper will warn on
      # first run regardless. TAURI_SIGNING_PRIVATE_KEY is a separate,
      # unrelated keypair: it signs the *update package* so the in-app
      # updater can verify an update actually came from this repo's CI
      # before installing it. Losing that key would only break auto-update,
      # not the ability to cut releases — a new one can be generated and its
      # public half swapped into tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: syncparty ${{ github.ref_name }}
          # Published rather than drafted so the download links work the moment
          # the tag is pushed — this is how guests are meant to get the app.
          releaseDraft: false
          # Aggregates every platform's signed artifacts into the latest.json
          # manifest the updater endpoint in tauri.conf.json points at.
          includeUpdaterJson: true
          releaseBody: |
            ## Install

            **Windows** — the `.exe` setup file below (or the `.msi`)
            **macOS** — `aarch64.dmg` for Apple silicon, `x64.dmg` for Intel

            Everything syncparty needs — Tailscale, the Syncplay client, mpv,
            and the Python environment for hosting — is checked on first launch
            and installed for you if it is missing.

            From this release on, syncparty checks for updates on startup and
            offers to install them in place — no need to come back here again.

            ## Before you open it

            These builds are unsigned. Windows SmartScreen will say "unknown
            publisher": choose **More info → Run anyway**. macOS Gatekeeper
            will refuse the first launch: **right-click the app → Open**.
