name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neither job pushes, comments, or otherwise writes anything back — this is
# read-only by design, including for PRs from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The frontend build output has to exist before `generate_context!`
      # will expand, even for a check that never renders anything.
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
        shell: bash

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Also regenerates src/shared/types, which the drift check below reads.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Generated types are up to date
        shell: bash
        run: |
          if ! git diff --quiet -- src/shared/types; then
            echo "::error::src/shared/types is stale — run 'cargo test' in src-tauri and commit the result."
            git diff -- src/shared/types
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
